# Yukawa bcc crystal heated through its melting point (main branch physics)
#
# 3456 = 2 x 12^3 particles start on a bcc lattice at Gamma = 400, well inside
# the solid phase (melting at Gamma_m ~ 217 for kappa = 1). A Langevin
# thermostat heats the system to Gamma = 100, the crystal melts, and the run
# continues without a thermostat (NVE). Compare g(r) of the first and last
# snapshots: split bcc shells at 1.76, 2.03, 2.87 a become liquid peaks.
#
# Try --set thermostat.temperature=0.0033 (Gamma = 300) to see the crystal survive.

[run]
name = "yukawa_crystal"
seed = 7

[domain]
box = [24.36, 24.36, 24.36]          # (4/3 pi N)^(1/3): one particle per Wigner-Seitz sphere

[[species]]
count = 3456
[species.placement]
region = "lattice"
lattice = "bcc"
[species.velocity]
temperature = 0.0025                  # Gamma = 400 (reduced temperature = 1/Gamma)

[interaction]
model = "yukawa"
kappa = 1.0

[thermostat]
type = "langevin"
temperature = 0.01                    # Gamma = 100
gamma = 0.1
until = 100.0

[time]
dt = 0.05
t_end = 150.0

[output]
every = 50
history_every = 10
