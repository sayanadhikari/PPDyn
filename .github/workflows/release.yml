name: Release to PyPI

# Pushing a tag vX.Y.Z builds the sdist and wheel, checks that the tag matches
# ppdyn.__version__, tests the wheel, uploads to PyPI with trusted publishing
# (no token stored in GitHub) and creates the GitHub release with the matching
# CHANGELOG section and the files attached:
#     git tag -a v2.0.1 -m "PPDyn 2.0.1" && git push origin v2.0.1
# or create a release with a new tag in the GitHub UI (the files are then added to it).
# "Run workflow" (manual) publishes the same build to TestPyPI instead.
#
# One-time setup on pypi.org (and test.pypi.org for the manual run):
#   project PPDyn -> Settings -> Publishing -> add a GitHub publisher with
#   owner sayanadhikari, repository PPDyn, workflow release.yml, environment pypi
#   (testpypi for TestPyPI).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/ppdyn/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "package $v, tag $tag"
          test "$v" = "$tag"
      - name: Test the wheel
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl pytest
          /tmp/w/bin/ppdyn --version
          cd /tmp && /tmp/w/bin/ppdyn init yukawa_crystal ex && /tmp/w/bin/ppdyn run ex/input.toml --set time.steps=20 -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/PPDyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\n### Install\n\n```bash\npip install --upgrade ppdyn\npip install "ppdyn[render]"   # with 3D renders and animations\n```\n' >> notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # release made in the GitHub UI (which also pushed the tag): keep its text, add the files
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "PPDyn $v" \
              --notes-file notes.md --verify-tag
          fi

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/PPDyn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
