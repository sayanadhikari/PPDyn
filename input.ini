;
; @file		input.ini
; @brief	PPDyn inputfile.
; @author	Sayan Adhikari <sayan.adhikari@fys.uio.no>
;         Rupak Mukherjee <rupakm@princeton.edu>


[simbox]
Lx  = 0.0   ; System length in X
Ly  = 0.0    ; System length in Y
Lz  = 0.0     ; System length in Z

[particles]
N     = 200 ; Number of particles
Vxmax = 1.0     ; Maximum velocity in X
Vymax = 1.0     ; Maximum velocity in Y
Vzmax = 1.0     ; Maximum velocity in Z
Temp  = 0.1     ;
dist = uniform_radius ;gaussian     ; Use distribution: True
mean = 1  ; if dist = True
stdDev = 0.2  ; if dist = True
density = 2000  ; in kg/m^3, only for uniform_radius
r_min = 0.001   ; in meters, only for uniform_radius
r_max = 0.01    ; in meters, only for uniform_radius
maxwell_load = True


[screening]
k = 0.0

[gravity]
g_0= 8.0;    Reduced Earth's gravity

[cutoff radius]
rc = 1e-5

[boundary]
btype = periodic ; Type of boundary Options: periodic, reflecting

[time]
tmax  = 10.0    ; Final time
dt    = 0.010   ; time step size

[diagnostics]
dumpPeriod  = 5    ; Data dump period
dumpData    = True
vtkData     = True
realTime    = False

[directory]
dataDir = data #put runname here
picDir = ../PINC/data

[options]
parallelMode  = True ;True ;set to false to disable parallel
PIC_data = True
object_data = True
E_norm_method = aOmega   ; Electric field normalization: 'mean' or 'max', norm

[normalization]
; Natural MD units (length a, time 1/Omega_pd)
Qref = 2.63e-5      ; reference dust charge [C]
mref = 1.66e-14   ; reference dust mass [kg] 